<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陀螺儀實驗室</title>
<meta name="description" content="仿 PhET 的陀螺儀模擬：陀螺儀的定軸性與進動，以及船上轉盤的角動量守恆。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面：仿 PhET「密度」——首頁選單元、全畫面場景、浮動小面板、上方可收合刻度條、底部黑色導覽列 */
:root {
  color-scheme: light;
  --text: #1b1f24;
  --muted: #5b6672;
  --line: #9aa5b1;
  --panel: rgba(255, 255, 255, 0.96);
  --accent: #2f7de1;
  --reset: #f2a33a;
  --ok: #1a9c4a;
  --bad: #d63a2f;
  --vec-L: #1565ff;
  --vec-tau: #e5332a;
  --vec-dL: #e09a00;
  --vec-F: #8e44ad;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--text); font-family: var(--sans); font-size: 15px; -webkit-font-smoothing: antialiased; }
button, select { font-family: inherit; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* 導覽列 */
.navbar { position: fixed; left: 0; right: 0; bottom: 0; height: 58px; background: #000; color: #fff; display: flex; align-items: center; gap: 10px; padding: 0 max(12px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(12px, env(safe-area-inset-left, 0px)); z-index: 50; }
.navbar .title { font-weight: 900; font-size: 18px; white-space: nowrap; }
.navbar .screens { flex: 1; display: flex; justify-content: center; gap: 6px; }
.nbtn { background: transparent; border: 0; color: #9aa3ad; display: flex; flex-direction: column; align-items: center; padding: 4px 12px; border-radius: 8px; cursor: pointer; }
.nbtn .ic { width: 40px; height: 26px; border-radius: 3px; overflow: hidden; background: linear-gradient(#dcefff, #fbfdff); display: flex; align-items: center; justify-content: center; }
.nbtn .ic svg { width: 36px; height: 24px; }
.nbtn span { font-size: 11px; margin-top: 1px; }
.nbtn.on { color: #ffd23f; }
.nbtn.on .ic { outline: 2px solid #ffd23f; }
.navbar .home-btn, .navbar .site-link { color: #fff; background: transparent; border: 1px solid #555; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }

/* 首頁 */
.home { position: fixed; inset: 0; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); z-index: 40; overflow-y: auto; }
.home h1 { margin: 0; font-size: clamp(34px, 6vw, 60px); font-weight: 500; letter-spacing: 2px; }
.tiles { display: flex; gap: 36px; flex-wrap: wrap; justify-content: center; }
.tile { background: transparent; border: 0; color: #fff; cursor: pointer; text-align: center; padding: 0; text-decoration: none; display: block; }
.tile .pic { width: 230px; height: 150px; border: 4px solid transparent; background: linear-gradient(#dcefff 0%, #fbfdff 70%, #d9b48a 70%); display: flex; align-items: center; justify-content: center; }
.tile:hover .pic, .tile:focus-visible .pic { border-color: #ffd23f; outline: none; }
.tile .pic svg { width: 80%; height: 90%; }
.tile b { display: block; font-size: 26px; font-weight: 500; margin-top: 6px; }
.tile small { display: block; color: #aab3bd; font-size: 13px; max-width: 230px; margin: 2px auto 0; }

/* 單元畫面 */
.screen { position: fixed; inset: 0 0 58px 0; }
.play { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(#cfe7ff 0%, #f4f9ff 62%); }
.play canvas { display: block; width: 100%; height: 100%; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.vlabel { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 18px; padding: 0 5px; border-radius: 5px; background: rgba(255, 255, 255, 0.85); white-space: nowrap; }
.dock { position: absolute; inset: 0; pointer-events: none; }
.dock > * { pointer-events: auto; }
.pbox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.pbox h3 { margin: 0 0 6px; font-size: 14px; font-weight: 900; }
.tr { position: absolute; top: 12px; right: 12px; width: 268px; }
.tc { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: min(470px, calc(100% - 600px)); min-width: 300px; }
.bl { position: absolute; left: 12px; bottom: 12px; width: 286px; }
.br { position: absolute; right: 12px; bottom: 78px; width: 268px; }
.hint { position: absolute; left: 12px; top: 12px; width: 280px; font-size: 13.5px; line-height: 1.55; }
.hint b { color: var(--vec-L); }

/* 元件 */
.btn { border: 1px solid #8a96a3; background: linear-gradient(#fff, #e6ebf0); color: var(--text); border-radius: 7px; padding: 6px 12px; font-size: 14px; font-weight: 700; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.btn:hover { border-color: var(--accent); }
.btn:active, .btn.held { background: #cfe2fa; border-color: var(--accent); }
.btn.on { background: linear-gradient(#5fd38a, #27a85a); color: #fff; border-color: #1d8a48; }
.btn:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.acts .btn { padding: 9px 6px; font-size: 14px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
select { width: 100%; padding: 5px 6px; font-size: 14px; border: 1px solid #8a96a3; border-radius: 4px; background: #fff; }
.sl { margin: 8px 0 2px; }
.sl .hd { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; align-items: center; }
.sl .hd .v { font-weight: 500; border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; background: #fff; min-width: 76px; text-align: right; font-variant-numeric: tabular-nums; }
.sl .ctl { display: flex; align-items: center; gap: 4px; }
.sl .ctl button { width: 28px; height: 28px; border: 1px solid #555; background: #fff; border-radius: 4px; cursor: pointer; font-size: 18px; font-weight: 900; line-height: 1; padding: 0; }
.sl input { flex: 1; -webkit-appearance: none; appearance: none; height: 26px; background: transparent; cursor: pointer; }
.sl input::-webkit-slider-runnable-track { height: 3px; background: #777; }
.sl input::-moz-range-track { height: 3px; background: #777; }
.sl input::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 22px; background: #e5332a; border: 1px solid #8b1a14; border-radius: 3px 3px 6px 6px; margin-top: -10px; }
.sl input::-moz-range-thumb { width: 11px; height: 20px; background: #e5332a; border: 1px solid #8b1a14; border-radius: 3px 3px 6px 6px; }
.ck { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-top: 6px; cursor: pointer; }
.ck input { width: 16px; height: 16px; accent-color: var(--accent); }
.read { font-size: 13px; margin-top: 6px; color: var(--muted); }
.read b { color: var(--text); font-variant-numeric: tabular-nums; }
.accordion > button { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; border: 0; padding: 0; font-weight: 900; font-size: 14px; cursor: pointer; color: var(--text); text-align: left; }
.accordion > button .tri { display: inline-flex; width: 16px; height: 16px; align-items: center; justify-content: center; background: #f2a33a; color: #fff; border-radius: 3px; font-size: 13px; line-height: 1; }
.accordion .body { margin-top: 6px; }
.accordion.closed .body { display: none; }
.scale { position: relative; height: 54px; margin: 0 22px; }
.scale .bar { position: absolute; left: 0; right: 0; top: 16px; height: 14px; border: 1px solid #333; background: #fff; }
.scale .tick { position: absolute; top: 16px; height: 14px; border-left: 1px solid #333; }
.scale .tl { position: absolute; top: 33px; transform: translateX(-50%); font-size: 11px; color: #333; white-space: nowrap; font-variant-numeric: tabular-nums; }
.scale .mk { position: absolute; top: 0; transform: translateX(-50%); color: var(--bad); font-size: 11px; font-weight: 900; white-space: nowrap; text-align: center; line-height: 1.1; }
.scale .mk::after { content: ""; display: block; margin: 1px auto 0; width: 0; height: 0; border: 5px solid transparent; border-top: 6px solid var(--bad); border-bottom: 0; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th, table.t td { padding: 3px 6px; border-bottom: 1px solid #dde3ea; text-align: left; }
table.t td:last-child, table.t th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.watch { font-size: 32px; font-weight: 900; font-variant-numeric: tabular-nums; text-align: center; background: #111; color: #ffd23f; border-radius: 6px; padding: 2px 0; margin: 4px 0 6px; }
.letters { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.letters .btn { padding: 7px 0; }
.letters .btn.cur { background: #cfe2fa; border-color: var(--accent); color: #0d4fa8; }
.ans { display: grid; grid-template-columns: 22px 1fr 18px; gap: 4px 6px; align-items: center; font-size: 13px; }
.ans select { font-size: 12.5px; padding: 3px; }
.mark { font-weight: 900; }
.q { font-size: 15px; font-weight: 700; line-height: 1.55; margin: 6px 0 8px; }
.q em { font-style: normal; color: #0d4fa8; background: #e3efff; border-radius: 4px; padding: 0 4px; }
.opt { display: block; width: 100%; text-align: left; margin: 5px 0; padding: 8px 10px; border-radius: 7px; border: 1px solid #8a96a3; background: #fff; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--text); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: #e6f7ec; }
.opt.wrong { border-color: var(--bad); background: #fdecea; }
.reveal { display: none; font-size: 13.5px; line-height: 1.6; margin-top: 8px; }
.reveal.show { display: block; }
.verdict { font-size: 16px; font-weight: 900; }
.timebar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.85); border-radius: 999px; padding: 4px 12px 4px 6px; border: 1px solid var(--line); z-index: 8; }
.round { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #8a96a3; background: radial-gradient(#fff, #e3e9ef); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.round svg { width: 20px; height: 20px; }
.timebar label { font-size: 13px; display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
.reset { position: absolute; right: 14px; bottom: 12px; width: 52px; height: 52px; border-radius: 50%; border: 1px solid #b06e12; background: radial-gradient(#ffc163, var(--reset)); cursor: pointer; z-index: 8; display: flex; align-items: center; justify-content: center; }
.reset svg { width: 30px; height: 30px; }
.modal-bg { position: fixed; inset: 0 0 58px 0; background: rgba(0, 0, 0, 0.45); display: none; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
.modal-bg.show { display: flex; }
.modal { background: #fff; border-radius: 12px; width: min(620px, 100%); max-height: 100%; overflow: auto; padding: 16px 20px 20px; font-size: 14.5px; line-height: 1.65; }
.modal h2 { margin: 0 0 6px; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
.modal h4 { margin: 14px 0 2px; color: #0d4fa8; }
.formula { font-family: "Times New Roman", serif; font-style: italic; font-size: 17px; text-align: center; background: #f4f7fa; border-radius: 6px; padding: 4px; margin: 4px 0; }

/* 左邊大畫面＋右邊控制欄 */
.screen.split .play { right: 330px; }
.screen.split .dock { position: absolute; top: 0; right: 0; bottom: 0; left: auto; width: 330px; overflow-y: auto; background: #eef3f8; border-left: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
.screen.split .dock > .pbox { position: static; width: auto; transform: none; min-width: 0; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 12.5px; margin-top: 8px; }
.legend i { display: inline-block; width: 22px; height: 6px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
.legend i.dash { height: 4px; background: repeating-linear-gradient(90deg, #222 0 6px, transparent 6px 10px); }
.showbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tog { border: 1px solid #8a96a3; background: #fff; color: var(--muted); border-radius: 7px; padding: 7px 4px; font-size: 14px; font-weight: 700; cursor: pointer; }
.tog.on { background: #cfe2fa; border-color: var(--accent); color: #0d4fa8; }
.tog:focus-visible { outline: 2px solid var(--accent); }
.rot-h { position: absolute; z-index: 5; transform: translate(-50%, -50%); color: #6b7480; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; text-align: center; padding: 2px; border-radius: 8px; }
.rot-h svg { display: block; width: 46px; height: 32px; margin: 0 auto; filter: drop-shadow(0 1px 1px rgba(255, 255, 255, 0.9)); }
.rot-h span { display: block; font-size: 11px; font-weight: 700; color: #4b5563; }
.rot-h:hover, .rot-h.active { color: #111; background: rgba(255, 255, 255, 0.6); }
.rot-h.active { cursor: grabbing; }
.rot-h:focus-visible { outline: 2px solid var(--accent); }
.prot { position: absolute; z-index: 6; width: 300px; transform: translate(-50%, -100%); pointer-events: none; user-select: none; -webkit-user-select: none; }
.prot svg { display: block; width: 100%; height: auto; }
.prot .grab { pointer-events: auto; cursor: pointer; touch-action: none; }
.prot #iProtKnob { cursor: grab; }
.prot.dragging .grab { cursor: grabbing; }
.bars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; height: 72px; }
.bars .bar { position: relative; border-left: 1px solid #c7d0da; border-right: 1px solid #c7d0da; background: linear-gradient(#000, #000) 0 50% / 100% 1px no-repeat; }
.bars .bar .fill { position: absolute; left: 18%; right: 18%; bottom: 50%; height: 0; border-radius: 2px; }
.bars .bar span { position: absolute; left: 0; right: 0; bottom: -18px; text-align: center; font-size: 12px; font-weight: 700; white-space: nowrap; }
.bars { margin-bottom: 18px; }
.quizbg { position: absolute; inset: 0; z-index: 40; background: rgba(10, 20, 35, 0.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.quizcard { position: relative; background: #fff; border-radius: 12px; width: min(460px, 100%); max-height: 100%; overflow: auto; padding: 16px 18px 18px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3); }
.quizcard .qx { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 8px; border: 1px solid #b8c2cc; background: #fff; font-size: 18px; cursor: pointer; line-height: 1; }
.quizcard .qx:hover { border-color: var(--accent); }
.quizcard .qtag { font-size: 13px; font-weight: 900; color: #0d4fa8; }
.quizcard .qbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
.qopen { position: absolute; left: 12px; top: 12px; z-index: 9; }
.val2 { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 14px; }
.val2 span:nth-child(even) { text-align: right; font-weight: 900; font-variant-numeric: tabular-nums; }
@media (max-width: 900px) {
  .screen.split .play { right: auto; }
  .screen.split .dock { position: static; width: auto; border-left: 0; overflow: visible; }
  html, body { overflow: auto; height: auto; }
  .screen { position: static; padding-bottom: 66px; background: #eef3f8; }
  .play { position: relative; height: 58svh; min-height: 330px; }
  .dock { position: static; display: flex; flex-direction: column; gap: 8px; padding: 8px max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); }
  .dock > .pbox { position: static; width: auto; transform: none; min-width: 0; }
  .hint { order: -1; }
  .navbar .title { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<!-- ============ 首頁 ============ -->
<div class="home" id="home">
  <div class="tiles">
    <button class="tile" data-go="intro">
      <div class="pic"><svg viewBox="0 0 160 110"><rect x="44" y="94" width="72" height="12" rx="2" fill="#d9302c"/><rect x="76" y="82" width="8" height="13" fill="#555"/><circle cx="80" cy="48" r="38" fill="none" stroke="#3a3f45" stroke-width="7"/><ellipse cx="80" cy="48" rx="30" ry="10" fill="none" stroke="#4b5158" stroke-width="7"/><ellipse cx="80" cy="48" rx="9" ry="24" fill="none" stroke="#5c636b" stroke-width="6"/><ellipse cx="96" cy="48" rx="5" ry="17" fill="#c8955c"/><line x1="80" y1="48" x2="146" y2="48" stroke="#1565ff" stroke-width="5"/><path d="M152 48 l-12 -6 v12 z" fill="#1565ff"/></svg></div>
      <b>陀螺儀</b>
    </button>
    <button class="tile" data-go="boat">
      <div class="pic" style="background:linear-gradient(#dcefff 0%, #fbfdff 60%, #4f9be0 60%)"><svg viewBox="0 0 160 110"><rect x="0" y="62" width="160" height="48" fill="#4f9be0"/><path d="M0 70 q20 -6 40 0 t40 0 t40 0 t40 0" fill="none" stroke="#9fd0ff" stroke-width="3"/><path d="M28 56 L118 56 Q140 58 150 66 Q140 74 118 78 L28 78 Z" fill="#f2f2f2" stroke="#555" stroke-width="3"/><rect x="74" y="44" width="10" height="14" fill="#9aa3ad"/><ellipse cx="79" cy="42" rx="30" ry="7" fill="#c8955c" stroke="#7a5230" stroke-width="2"/><path d="M48 22 A34 12 0 0 1 110 22" fill="none" stroke="#1565ff" stroke-width="4"/><path d="M114 24 l-10 -7 l1 11 z" fill="#1565ff"/><path d="M44 98 A40 10 0 0 0 116 98" fill="none" stroke="#ff8c1a" stroke-width="4"/><path d="M40 95 l3 10 l8 -6 z" fill="#ff8c1a"/></svg></div>
      <b>船</b>
    </button>
  </div>
</div>

<!-- ============ 介紹 ============ -->
<section class="screen split" data-screen="intro" hidden>
  <div class="play"><div class="labels"></div>
    <div class="rot-h" id="iRotRoll" tabindex="0" role="slider" aria-label="左右傾斜底座（按住左右拖，或拖量角器上的紅點）" aria-valuemin="-35" aria-valuemax="35" aria-valuenow="0">
      <svg viewBox="0 0 60 40"><path d="M10 30 A 22 22 0 0 1 50 30" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M3 25 L12 36 L16 23 Z M57 25 L48 36 L44 23 Z" fill="currentColor"/></svg>
      <span>左右</span>
    </div>
    <div class="prot" id="iProt" hidden>
      <svg viewBox="-160 -150 320 172" id="iProtSvg">
        <path d="M -130 0 A 130 130 0 0 1 130 0" fill="rgba(255,255,255,0.88)" stroke="#5b6672" stroke-width="2"/>
        <path id="iProtRange" fill="rgba(47,125,225,0.14)" d=""/>
        <g id="iProtTicks"></g>
        <path class="grab" id="iProtHit" d="M -126 0 A 126 126 0 0 1 126 0" fill="none" stroke="transparent" stroke-width="34"/>
        <line id="iProtNeedle" x1="0" y1="0" x2="0" y2="-118" stroke="#e5332a" stroke-width="3"/>
        <circle class="grab" id="iProtKnob" cx="0" cy="-118" r="11" fill="#e5332a" stroke="#8b1a14" stroke-width="2"/>
        <text id="iProtVal" x="0" y="-26" font-size="22" font-weight="900" text-anchor="middle" fill="#1b1f24">0°</text>
        <text id="iProtL" x="-140" y="16" font-size="14" font-weight="900" fill="#5a3d22">左</text>
        <text id="iProtR" x="126" y="16" font-size="14" font-weight="900" fill="#5a3d22">右</text>
      </svg>
    </div>
    <div class="timebar"><button class="round" data-act="play"></button>
      <label><input type="radio" name="spd-intro" value="1" checked> 正常</label>
      <label><input type="radio" name="spd-intro" value="0.2"> 慢動作</label></div>
    <button class="reset" data-act="reset" aria-label="全部重設"></button>
  </div>
  <div class="dock">
    <div class="pbox">
      <h3>馬達</h3>
      <div class="row"><button class="btn" id="iPower">馬達：關</button><span class="num" id="iRpmNow" style="font-weight:700">0 rpm</span></div>
      <div class="sl"><div class="hd"><span>轉速</span><span class="v" id="vRpm">6000 rpm</span></div>
        <div class="ctl"><button data-step="-500" data-for="iRpm" aria-label="減少">−</button><input type="range" id="iRpm" min="0" max="8000" step="500" value="6000"><button data-step="500" data-for="iRpm" aria-label="增加">＋</button></div></div>
    </div>
    <div class="pbox">
      <h3>木圓盤</h3>
      <div class="sl" style="margin-top:0"><div class="hd"><span>半徑</span><span class="v" id="vRad">3.0 cm</span></div>

<script>
/* 簡易環繞相機：拖曳旋轉、滾輪／雙指縮放（不需額外函式庫） */
(function (root) {
  'use strict';
  class Orbit {
    constructor(camera, dom, opts) {
      opts = opts || {};
      this.camera = camera; this.dom = dom;
      this.target = opts.target || new THREE.Vector3(0, 0, 0);
      this.dist = opts.dist || 5; this.yaw = opts.yaw || 0.6; this.pitch = opts.pitch || 0.5;
      this.minDist = opts.minDist || 1; this.maxDist = opts.maxDist || 30;
      this.minPitch = opts.minPitch != null ? opts.minPitch : 0.05; this.maxPitch = opts.maxPitch || 1.5;
      this.home = { dist: this.dist, yaw: this.yaw, pitch: this.pitch };
      this.pointers = new Map();
      dom.style.touchAction = 'none';
      dom.addEventListener('pointerdown', e => { if (this.enabled === false) return; if (e.isPrimary) this.pointers.clear(); try { dom.setPointerCapture(e.pointerId); } catch (_) {} this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); });
      dom.addEventListener('pointermove', e => {
        if (this.enabled === false || !this.pointers.has(e.pointerId)) return;
        const p = this.pointers.get(e.pointerId);
        if (this.pointers.size === 1) {
          this.yaw -= (e.clientX - p.x) * 0.008;
          this.pitch = Math.max(this.minPitch, Math.min(this.maxPitch, this.pitch + (e.clientY - p.y) * 0.006));
        } else if (this.pointers.size === 2) {
          const pts = [...this.pointers.values()];
          const d0 = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          p.x = e.clientX; p.y = e.clientY;
          const pts2 = [...this.pointers.values()];
          const d1 = Math.hypot(pts2[0].x - pts2[1].x, pts2[0].y - pts2[1].y);
          if (d0 > 0) this.zoom(d0 / d1);
        }
        p.x = e.clientX; p.y = e.clientY;
        this.update();
      });
      const up = e => this.pointers.delete(e.pointerId);
      dom.addEventListener('pointerup', up); dom.addEventListener('pointercancel', up); dom.addEventListener('lostpointercapture', up);
      dom.addEventListener('wheel', e => { if (this.enabled === false) return; e.preventDefault(); this.zoom(Math.exp(e.deltaY * 0.001)); this.update(); }, { passive: false });
      this.update();
    }
    zoom(f) { this.dist = Math.max(this.minDist, Math.min(this.maxDist, this.dist * f)); }
    reset() { Object.assign(this, this.home); this.update(); }
    update() {
      const c = Math.cos(this.pitch), t = this.target;
      this.camera.position.set(t.x + this.dist * c * Math.sin(this.yaw), t.y + this.dist * Math.sin(this.pitch), t.z + this.dist * c * Math.cos(this.yaw));
      this.camera.lookAt(t);
    }
  }
  /* 讓 3D 物件旁邊顯示 HTML 標籤 */
  function placeLabel(el, pos3, camera, w, h) {
    const v = pos3.clone().project(camera);
    if (v.z > 1) { el.style.display = 'none'; return; }
    el.style.display = '';
    el.style.left = ((v.x + 1) / 2 * w) + 'px';
    el.style.top = ((1 - v.y) / 2 * h) + 'px';
  }
  /* 滑桿進度條顏色 */
  function paintRange(input) {
    const pct = (input.value - input.min) / (input.max - input.min) * 100;
    input.style.setProperty('--pct', pct + '%');
  }
  root.Orbit = Orbit; root.placeLabel = placeLabel; root.paintRange = paintRange;
})(this);

<script>
/* 陀螺儀實驗室：物理核心（不依賴畫面，可單獨測試）
 * 物理座標：x 向前、y 向左、z 向上（右手座標）
 * 1) Gimbal   三環萬向支架＋馬達飛輪（我們的實體陀螺儀）
 * 2) BoatSpin 船上馬達開機時，船往反方向轉（角動量守恆）
 * 3) BoatRoll 搖晃船：轉盤裝在鉸鏈上，或直接固定在船上
 */
(function (root) {
  'use strict';
  const g = 9.8;
  const V = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    len: a => Math.hypot(a[0], a[1], a[2]),
    unit: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
    // Rodrigues：把向量 a 繞單位軸 k 轉 t 弧度
    rot: (a, k, t) => {
      const c = Math.cos(t), s = Math.sin(t), kd = k[0] * a[0] + k[1] * a[1] + k[2] * a[2];
      const kx = [k[1] * a[2] - k[2] * a[1], k[2] * a[0] - k[0] * a[2], k[0] * a[1] - k[1] * a[0]];
      return [a[0] * c + kx[0] * s + k[0] * kd * (1 - c), a[1] * c + kx[1] * s + k[1] * kd * (1 - c), a[2] * c + kx[2] * s + k[2] * kd * (1 - c)];
    }
  };

  /* ---------- 1. 三環萬向支架陀螺儀 ----------
   * 內環（含橫樑、馬達、電池、飛輪）的姿態用三個正交單位向量 ex, ey, ez 表示，
   * 飛輪轉軸 n = ez。萬向支架讓 n 可以指向任何方向。
   * 自轉角動量 L = I3 ω n；軸本身的角速度 Ω（垂直 n）＋繞 n 的轉動 σ。
   *   I_t dΩ/dt = τ⊥ − L (Ω × n)      ← 陀螺效應：力矩讓軸往 τ 的方向偏，而不是往力的方向倒
   *   I_n dσ/dt = τ∥ − dL/dt           ← 馬達加速時，反作用力讓支架繞轉軸反轉
   * 力矩：軸承摩擦（把內環往底座的轉動拖）、重心偏差 δ 的重力、手推。 */
  class Gimbal {
    constructor(p) {
      this.p = Object.assign({
        I3: 3.9e-5,   // 飛輪轉動慣量（木圓盤＋8 枚硬幣）
        It: 3.0e-4,   // 內環組件（含部分環）繞橫向軸的轉動慣量
        In: 2.0e-4,   // 繞飛輪軸
        M: 0.12,      // 內環上所有東西的質量
        c: 2.0e-4,    // 軸承摩擦（橫向）
        cn: 4.0e-3,   // 軸承摩擦（繞飛輪軸，3D 列印轉軸比較緊）
        lever: 0.04,  // 手推的力臂（推在內環邊緣）
        tauUp: 3.5, tauDown: 10, // 馬達加速、滑行的時間常數 (s)
        rpm: 6000, delta: 0     // 馬達目標轉速、重心偏差 (m，正 = 偏向馬達那側)
      }, p || {});
      this.reset();
    }
    reset() {
      // 一開始飛輪軸朝上（跟最外圈的轉軸平行），角動量 L 朝上
      this.ex = [1, 0, 0]; this.ey = [0, 1, 0]; this.ez = [0, 0, 1];
      this.Om = [0, 0, 0]; this.sigma = 0;
      this.w = 0; this.motor = false;
      this.baseAngle = 0; this.baseRate = 0; this.baseTilt = 0; this.tiltRate = 0; this.basePitch = 0; this.pitchRate = 0;
      this.push = [0, 0, 0]; this.t = 0; this.lastTau = [0, 0, 0];
    }
    get n() { return this.ez; }
    get L() { return this.p.I3 * this.w; }
    get rpmNow() { return this.w * 30 / Math.PI; }
    /* 重力力矩 τ = (δ n) × (−M g ẑ) */
    gravTorque() { const n = this.ez; return V.mul([n[1], -n[0], 0], -this.p.M * g * this.p.delta); }
    /* 理論進動角速度 Ω = M g δ / L（跟軸的仰角無關） */
    get omegaTheory() { return Math.abs(this.L) < 1e-7 ? NaN : this.p.M * g * this.p.delta / this.L; }
    step(dt) {
      const p = this.p;
      // 馬達：一階加速／滑行
      const wt = this.motor ? p.rpm * Math.PI / 30 : 0;
      const tc = this.motor && Math.abs(wt) >= Math.abs(this.w) ? p.tauUp : p.tauDown;
      const dw = (wt - this.w) * (1 - Math.exp(-dt / tc));
      this.w += dw;
      const L = p.I3 * this.w, dL = p.I3 * dw;
      // 底座的角速度：繞鉛直軸轉（baseRate）＋繞底座長邊傾斜（tiltRate）
      // ＋前後傾斜（basePitch，繞底座自己的 y 軸）
      const ct0 = Math.cos(this.baseTilt), st0 = Math.sin(this.baseTilt), cy0 = Math.cos(this.baseAngle), sy0 = Math.sin(this.baseAngle);
      const n = this.ez, wb = [this.tiltRate * cy0 - this.pitchRate * sy0 * ct0, this.tiltRate * sy0 + this.pitchRate * cy0 * ct0, this.baseRate + this.pitchRate * st0];
      const wtot = V.add(this.Om, V.mul(n, this.sigma));
      // 力矩
      let tau = V.add(this.gravTorque(), this.push);
      const rel = V.sub(wtot, wb);
      const relPar = V.dot(rel, n), relPerp = V.sub(rel, V.mul(n, relPar));
      tau = V.add(tau, V.mul(relPerp, -p.c));
      const tPar = V.dot(tau, n) - p.cn * relPar;
      const tPerp = V.sub(tau, V.mul(n, V.dot(tau, n)));
      this.lastTau = tPerp;
      // 橫向：先加力矩，再做陀螺項（繞 n 旋轉 Ω，精確解，大轉速也穩定）
      let Om = V.add(this.Om, V.mul(tPerp, dt / p.It));
      if (Math.abs(L) > 0) Om = V.rot(Om, n, (L / p.It) * dt);
      Om = V.sub(Om, V.mul(n, V.dot(Om, n)));
      this.Om = Om;
      // 繞飛輪軸：馬達反作用
      this.sigma += (tPar * dt - dL) / p.In;
      // 姿態更新
      const w2 = V.add(this.Om, V.mul(n, this.sigma)), wl = V.len(w2);
      if (wl > 1e-12) {
        const k = V.mul(w2, 1 / wl), a = wl * dt;
        this.ex = V.rot(this.ex, k, a); this.ey = V.rot(this.ey, k, a); this.ez = V.rot(this.ez, k, a);
      }
      // 正交化
      this.ez = V.unit(this.ez); this.ex = V.unit(V.sub(this.ex, V.mul(this.ez, V.dot(this.ex, this.ez))));
      this.ey = V.cross(this.ez, this.ex);
      this.baseAngle += this.baseRate * dt;
      this.baseTilt += this.tiltRate * dt;
      this.basePitch += this.pitchRate * dt;
      this.t += dt;
    }
    /* 把內環姿態拆成三個環的角度：R = Rz(a)·Rx(b)·Ry(c)
     * a：外環繞鉛直軸、b：中環繞外環的水平軸、c：內環繞中環的軸 */
    ringAngles() {
      // 我們的陀螺儀：最外圈跟底座一體（不動）。
      //   第 2 圈：用最外圈上、下兩點當轉軸（鉛直 z 軸）       → 角度 a
      //   第 3 圈：用第 2 圈左、右兩點當轉軸（x 軸）           → 角度 b
      //   最內圈：用第 3 圈前、後兩點當轉軸（y 軸）            → 角度 c
      //   飛輪軸在最內圈平面上、垂直於內圈轉軸；一開始跟最外圈的轉軸平行（朝上）
      // 姿態（相對底座）R = Rz(a)·Rx(b)·Ry(c)，最內圈座標 = 飛輪座標
      const cy = Math.cos(this.baseAngle), sy = Math.sin(this.baseAngle), ct = Math.cos(this.baseTilt), st = Math.sin(this.baseTilt);
      const cp = Math.cos(this.basePitch), sp = Math.sin(this.basePitch);
      const toBase = v => { const x = cy * v[0] + sy * v[1], y = -sy * v[0] + cy * v[1], z = v[2]; const y2 = ct * y + st * z, z2 = -st * y + ct * z; return [cp * x - sp * z2, y2, sp * x + cp * z2]; };
      const ex = toBase(this.ex), ey = toBase(this.ey), ez = toBase(this.ez);
      const R = [[ex[0], ey[0], ez[0]], [ex[1], ey[1], ez[1]], [ex[2], ey[2], ez[2]]];
      const b = Math.asin(Math.max(-1, Math.min(1, R[2][1])));
      const a = Math.atan2(-R[0][1], R[1][1]);
      const c = Math.atan2(-R[2][0], R[2][2]);
      return { a, b, c };
    }
    /* 飛輪軸的方位角與仰角 */
    axisAngles() { const n = this.ez; return { az: Math.atan2(n[1], n[0]), el: Math.asin(Math.max(-1, Math.min(1, n[2]))) }; }
  }

  /* ---------- 2. 船上馬達開機：船往反方向轉 ----------
   * 轉盤（繞鉛直軸）：I_r ω_r' = τ_m − b(ω_r − ψ') − c_air ω_r
   * 船（偏航 ψ）：    I_b ψ''  = −τ_m + b(ω_r − ψ') − c_w ψ'
   * τ_m 是馬達給轉盤的力矩，船受到大小相等、方向相反的反作用力矩。
   * 沒有水和空氣阻力時，I_r ω_r + I_b ψ' 永遠等於 0（角動量守恆）。 */
  class BoatSpin {
    constructor(p) {
      this.p = Object.assign({
        Ir: 5.0e-5, Ib: 1.0e-3, tauStall: 3.0e-3, w0: 1000, // 轉盤、船、馬達堵轉力矩、空轉轉速 (rad/s)
        b: 2e-7, cAir: 6e-7, cw: 2e-3, water: true, hold: false
      }, p || {});
      this.reset();
    }
    reset() { this.wr = 0; this.psid = 0; this.psi = 0; this.motor = false; this.Lout = 0; this.t = 0; }
    get Lr() { return this.p.Ir * this.wr; }
    get Lb() { return this.p.Ib * this.psid; }
    step(dt) {
      const p = this.p, rel = this.wr - this.psid;
      const d = p.dir === -1 ? -1 : 1; // 馬達方向：1 = 從上面看逆時針，−1 = 順時針
      const tm = this.motor ? d * p.tauStall * Math.max(-1, 1 - d * rel / p.w0) : 0;
      const tb = p.b * rel, ta = p.cAir * this.wr;
      const tw = p.water ? p.cw * this.psid : 0;
      let ext; // 外界（水、空氣、手）給「船＋轉盤」系統的力矩
      this.wr += (tm - tb - ta) / p.Ir * dt;
      if (p.hold) {
        // 手扶著船：船不轉，手吸收了船受到的反作用力矩
        ext = -ta + (tm - tb);
        this.psid = 0;
      } else {
        ext = -ta - tw;
        this.psid += (-tm + tb - tw) / p.Ib * dt;
      }
      this.psi += this.psid * dt;
      this.Lout -= ext * dt; // 外界帶走的角動量（讓三者加總永遠是 0）
      this.t += dt;
    }
  }

  /* ---------- 3. 搖晃船 ----------
   * φ：船橫搖（繞 x，正 = 右舷往下）；θ：第二個自由度
   *   鉸鏈：θ = 轉盤架前後倒（正 = 頂端往船頭）
   *   固定：θ = 整艘船前後點頭（正 = 船頭往下）
   * dL/dt = (φ' x̂ + θ' ŷ) × Lẑ = L(θ' x̂ − φ' ŷ)
   *   I_θ θ'' = L φ' cosθ − k_θ sinθ − c_θ θ'

  const batt = new THREE.Mesh(new THREE.BoxGeometry(4.5, 1.4, 2.2), M(0x2b6cb0)); batt.position.set(-5.5, DECK + 0.7, 0); boat.add(batt);
  const motor = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 2.7, 24), M(0xb8c0c8, { metalness: 0.7 })); motor.position.set(0, DECK + 0.4 + 1.35, 0); boat.add(motor);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 2.2, 8), M(0xd0d6dd, { metalness: 0.8 })); shaft.position.set(0, DECK + 0.4 + 2.7 + 0.6, 0); boat.add(shaft);
  const disk = new THREE.Group(); disk.position.set(0, DECK + 0.4 + 2.7 + 1.1, 0); boat.add(disk);
  const wood = M(0xc8955c, { roughness: 0.8 });
  let dparts = [];
  const setDiskMesh = r => {
    dparts.forEach(m => { disk.remove(m); m.geometry.dispose(); }); dparts = [];
    const a = m => { disk.add(m); dparts.push(m); return m; };
    a(new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.6, 48), wood));
    const s1 = a(new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.06, r * 0.8), M(0xe5332a))); s1.position.set(0, 0.32, r * 0.5);
    const s2 = a(new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.08, 12), M(0x222222))); s2.position.set(r * 0.7, 0.32, 0);
  };
  // 角動量箭頭：轉盤的畫在轉軸上，船的畫在船尾
  const arrR = makeArrow(COL.L, 0.32), arrB = makeArrow(0xff8c1a, 0.32); scene.add(arrR, arrB);
  const labR = v.label('L 轉盤', 'var(--vec-L)'), labB = v.label('L 船', '#c25e00');

  // 船的轉動慣量算進「被船帶著一起轉的水」，所以比空船大；水的阻力讓船轉一下就慢下來
  // 水對慢慢轉的船阻力很小（cw 小），轉盤又一直受到一點空氣阻力，馬達得一直推轉盤，
  // 反作用力也一直推船，所以實際的船會一直慢慢轉，不會停（跟實體實驗一致）
  const sim = new BoatSpin({ Ir: 4.6e-6, Ib: 1.9e-3, tauStall: 1.0e-2, w0: 600, b: 2e-7, cAir: 1e-7, cw: 2e-4 });
  const st = { vis: 0, arrows: true, brake: false };
  const LREF = 0.008;
  const rad = $('#bRad');
  const diskI = r => 0.5 * (1.13 * r * r) * r * r; // g·cm²（木頭厚 6 mm，質量 ≈ 1.13 r² g）
  const setRad = () => {
    const r = Math.max(2, Math.min(5, +rad.value)); rad.value = r;
    $('#vBRad').textContent = r.toFixed(1) + ' cm';
    const I = diskI(r); sim.p.Ir = I * 1e-7; setDiskMesh(r);
  };
  rad.oninput = setRad;
  // 船的質量 → 轉動慣量：把船看成長 20 cm、寬 8 cm 的長方形板，I = m (長² + 寬²) / 12 ≈ 38.7 m（g·cm²）
  const mass = $('#bMass');
  const setMass = () => {
    const m = Math.max(100, Math.min(1000, Math.round(+mass.value / 50) * 50)); mass.value = m;
    $('#vBMass').textContent = m + ' g'; sim.p.Ib = m * (20 * 20 + 8 * 8) / 12 * 1e-7;
  };
  mass.oninput = setMass;
  $$('[data-step]', v.sec).forEach(b => b.onclick = () => { const el = $('#' + b.dataset.for); el.value = +el.value + +b.dataset.step; if (el === mass) setMass(); else setRad(); });
  const power = $('#bPower'), paintPower = () => { power.classList.toggle('on', sim.motor); power.textContent = sim.motor ? '馬達：開' : '馬達：關'; };
  power.onclick = () => { sim.motor = !sim.motor; paintPower(); };
  // 抓住轉盤：按住時轉盤和船之間摩擦變很大
  const brake = $('#bBrake');
  const setBrake = on => { st.brake = on; brake.classList.toggle('held', on); if (on && sim.motor) { sim.motor = false; paintPower(); } };
  brake.addEventListener('pointerdown', e => { e.preventDefault(); try { brake.setPointerCapture(e.pointerId); } catch (_) {} setBrake(true); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => brake.addEventListener(t, () => setBrake(false)));
  brake.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setBrake(true); } });
  brake.addEventListener('keyup', () => setBrake(false));
  // 轉盤方向：順時針（從上面看）= 角動量朝下
  const cwB = $('#bCW'), ccwB = $('#bCCW');
  const setDir = d => { sim.p.dir = d; cwB.classList.toggle('on', d === -1); ccwB.classList.toggle('on', d === 1); };
  cwB.onclick = () => setDir(-1); ccwB.onclick = () => setDir(1);
  const wOn = $('#bWaterOn'), wOff = $('#bWaterOff');
  const setWater = on => { sim.p.water = on; sim.p.cAir = on ? 1e-7 : 0; wOn.classList.toggle('on', on); wOff.classList.toggle('on', !on); };
  const restart = () => { sim.reset(); st.vis = 0; setBrake(false); paintPower(); };
  wOn.onclick = () => { setWater(true); restart(); }; wOff.onclick = () => { setWater(false); restart(); };
  $('#bArrows').onclick = () => { st.arrows = !st.arrows; $('#bArrows').classList.toggle('on', st.arrows); };
  const fills = $$('#bBars .fill');
  const bar = (el, L) => { // 長條：往上是正（從上面看逆時針），往下是負
    const h = Math.min(50, Math.abs(L) / LREF * 50);
    el.style.height = h + '%';
    if (L >= 0) { el.style.bottom = '50%'; el.style.top = 'auto'; } else { el.style.top = '50%'; el.style.bottom = 'auto'; }
  };
  v.reset = () => { sim.reset(); st.vis = 0; boat.rotation.y = 0; setBrake(false); rad.value = 3; setRad(); mass.value = 500; setMass(); setWater(true); setDir(-1); paintPower(); };
  v.step = dt => {
    const sdt = dt * v.speed;
    sim.p.b = st.brake ? 3e-3 : 2e-7;
    const N = Math.max(1, Math.round(sdt / 0.0005)); for (let k = 0; k < N; k++) sim.step(sdt / N);
    if (![sim.wr, sim.psid, sim.psi].every(Number.isFinite)) sim.reset();
    // 轉盤畫面上的轉速：太快會看不出在轉，最多畫 26 rad/s（方向正確）
    const rel = sim.wr - sim.psid; st.vis += Math.sign(rel) * Math.min(Math.abs(rel), 26) * dt;
  };
  let rd = 0;
  v.update = (w, h) => {
    boat.rotation.y = sim.psi; disk.rotation.y = st.vis;
    const len = L => Math.abs(L) < 1e-6 ? 0 : Math.max(2.2, Math.min(14, 12 * Math.abs(L) / LREF));
    const up = new THREE.Vector3(0, 1, 0), down = new THREE.Vector3(0, -1, 0);
    const oR = new THREE.Vector3(0, 2.1 + 0.4 + 2.7 + 1.5, 0); boat.localToWorld(oR);
    const lr = len(sim.Lr), lb = len(sim.Lb);
    arrR.set(oR, sim.Lr >= 0 ? up : down, st.arrows ? lr : 0);
    const oB = new THREE.Vector3(-11, 5.4, 0); boat.localToWorld(oB);
    arrB.set(oB, sim.Lb >= 0 ? up : down, st.arrows ? lb : 0);
    const lab = (el, arr, o, L, l) => { if (!arr.visible) { el.style.display = 'none'; return; } placeLabel(el, o.clone().add(new THREE.Vector3(0, (L >= 0 ? 1 : -1) * (l + 1.2), 0)), camera, w, h); };
    lab(labR, arrR, oR, sim.Lr, lr); lab(labB, arrB, oB, sim.Lb, lb);
    const now = performance.now(); if (now - rd < 100) return; rd = now;
    const rr = Math.round((sim.wr - sim.psid) * 30 / Math.PI); $('#bRpmR').textContent = Math.abs(rr) + ' rpm' + (rr > 0 ? ' ↺' : rr < 0 ? ' ↻' : ''); // 相對船（坐在船上看到的），不顯示負號、改用方向符號
    const rb = sim.psid * 30 / Math.PI; $('#bRpmB').textContent = Math.abs(rb).toFixed(1) + ' rpm' + (rb > 0.05 ? ' ↺' : rb < -0.05 ? ' ↻' : '');
    const deg = sim.psi * 180 / Math.PI;
    $('#bAng').textContent = Math.abs(deg) < 0.5 ? '0°' : Math.round(Math.abs(deg)) + '° ' + (deg > 0 ? '逆時針' : '順時針');
    bar(fills[0], sim.Lr); bar(fills[1], sim.Lb);
  };
  v.reset();
  v.orbit = new Orbit(camera, canvas, { target: new THREE.Vector3(0, 1.5, 0), dist: 46, yaw: 0.7, pitch: 0.62, minDist: 18, maxDist: 100 });
  makeQuiz(v, [
    { text: '船原本靜止在水上。打開馬達，讓船裡的轉盤從上面看<em>順時針</em>轉，船會怎麼轉？',
      opts: [['cw', '跟著順時針轉'], ['ccw', '往逆時針轉'], ['none', '不會轉']], ans: 'ccw',
      why: '一開始船和轉盤都沒轉，角動量加起來是 0。馬達推轉盤順時針轉的同時，轉盤也把馬達和船往反方向推，所以船<b>往逆時針轉</b>，兩個的角動量一正一負，加起來還是 0。' }
  ], () => setDir(-1));
})();

/* ---------- 切換畫面 ---------- */
let cur = null;
function go(name) {
  $('.navbar').hidden = name === 'home' || !views[name]; // 首頁不要導覽列
  if (name === 'home' || !views[name]) { name = 'home'; cur = null; $('#home').hidden = false; $$('.screen').forEach(s => s.hidden = true); }
  else {
    $('#home').hidden = true; cur = views[name];
    $$('.screen').forEach(s => s.hidden = s.dataset.screen !== name);
    cur.play.insertBefore(canvas, cur.play.firstChild);
    Object.values(views).forEach(x => { x.orbit.enabled = x === cur; });
    cur.orbit.update(); resize();
    if (cur.quiz && !cur.quiz.seen) cur.quiz.open();
  }
  $$('.nbtn').forEach(b => b.classList.toggle('on', b.dataset.go === name));
  try { history.replaceState(null, '', name === 'home' ? location.pathname : '#' + name); } catch (e) { /* 預覽環境可能不允許 */ }
  window.scrollTo(0, 0);
}
$$('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
$$('[data-open]').forEach(b => b.onclick = () => $('#' + b.dataset.open).classList.add('show'));
$$('.modal-bg').forEach(m => m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) m.classList.remove('show'); }));
function resize() { if (!cur) return; const w = cur.play.clientWidth, h = cur.play.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
const ro = new ResizeObserver(resize); Object.values(views).forEach(x => ro.observe(x.play));
let last = performance.now();
let errShown = 0;
function loop(now) {
  requestAnimationFrame(loop); // 先排下一格：就算這一格出錯，畫面也不會停住
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (!cur) return;
  try {
    if (!cur.paused) cur.step(dt);
    camera.updateMatrixWorld(); cur.update(cur.play.clientWidth, cur.play.clientHeight); renderer.render(cur.scene, camera);
  } catch (err) { if (errShown++ < 3) { console.error('[gyro] frame error', err); showErr(err); } }
}
// 出錯時在畫面左下角顯示紅字（方便截圖回報）
function showErr(err) {
  let box = document.getElementById('errBox');
  if (!box) { box = document.createElement('div'); box.id = 'errBox'; box.style.cssText = 'position:fixed;left:8px;bottom:70px;z-index:999;max-width:min(520px,90vw);background:#fff0f0;color:#b00020;border:2px solid #b00020;border-radius:8px;padding:8px 10px;font:12px/1.4 monospace;white-space:pre-wrap;user-select:text'; document.body.appendChild(box); }
  const stack = String((err && err.stack) || err).split('\n').slice(0, 4).join('\n');
  box.textContent = '⚠ 程式出錯了（請截圖給組員）\n' + stack;
}
window.addEventListener('error', e => showErr(e.error || e.message));
go(location.hash.slice(1) || 'home');
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
